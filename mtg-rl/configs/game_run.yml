# game_run.yml — the REAL game config: full search budget, long games, real thread count.
# The runner overwrites deck paths, output files, games, ports and prior flags; the rest
# passes through. Only the search knobs matter for quality vs wall-clock here.
#
# Measured on this PC: 53 MCTS evaluations/second. At search_budget 600 a game runs several
# minutes, so games_per_gen in run_mz.yml (not generations) is what fits in a night.

goes_first: random
game_mode: normal

player_a:
  deckPath: xmage/decks/UWTempo.dck
  type: mcts
  priors:
    priority: false
    target: false
    binary: false
    opponent: false
    prior_temperature: 1.5
    prior_bonus: 0.0
  noise:
    enabled: true            # exploration in the bootstrap and early gens
    dirichlet_noise: 0.15
    selection_temperature: 2
  mcts:
    search_budget: 600       # the shipped default is 1000; 600 is the compromise for a night
    timeout_ms: 1200
    td_discount: 0.95
    offline_mode: true
    prune_duplicate_states: true
  gameplay:
    mulligans_enabled: true
    manual_tapping: false
  hidden_info:
    see_opponent_hand: false   # no peeking: honest evaluation

player_b:
  deckPath: xmage/decks/Standard-MonoB.dck
  type: mcts
  priors:
    priority: false
    target: false
    binary: false
    opponent: false
    prior_temperature: 1.5
    prior_bonus: 0.0
  noise:
    enabled: true
    dirichlet_noise: 0.15
    selection_temperature: 2
  mcts:
    search_budget: 600
    timeout_ms: 1200
    td_discount: 0.95
    offline_mode: true
    prune_duplicate_states: true
  gameplay:
    mulligans_enabled: true
    manual_tapping: false
  hidden_info:
    see_opponent_hand: false

training:
  games: 100
  threads: 6                 # in-JVM parallelism: 6 cores per JVM x 2 JVMs = 12 of 16
  max_turns: 50
  max_minutes: 25

server:
  host: localhost
  port: 50052
  opponent_port: 50053

logging:
  sparse: true
  all_threads: false
  log_feature_hash: false
  save_final_wr: true
  show_mcts_info: false
