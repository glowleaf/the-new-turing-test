# run5.yml — BASELINE: stock greedy AI (minimax) vs stock greedy AI, same decks, 50 games.
# Compare this win rate against run4 (Laya as player A) to see whether Laya's decisions help.
goes_first: random
game_mode: normal

player_a:
  deckPath: decks/Standard-MonoR.dck
  type: minimax
  noise:
    enabled: false
  mcts:
    search_budget: 300
    timeout_ms: 4000
    td_discount: 0.95
    offline_mode: true
    prune_duplicate_states: true
  gameplay:
    mulligans_enabled: true
    manual_tapping: false
  hidden_info:
    see_opponent_hand: false

player_b:
  deckPath: decks/Standard-MonoG.dck
  type: minimax
  noise:
    enabled: false
  mcts:
    search_budget: 300
    timeout_ms: 4000
    td_discount: 0.95
    offline_mode: true
    prune_duplicate_states: true
  gameplay:
    mulligans_enabled: true
    manual_tapping: false
  hidden_info:
    see_opponent_hand: false

training:
  games: 50
  threads: 4
  max_turns: 40
  max_minutes: 15

server:
  host: localhost
  port: 50052
  opponent_port: 50053

logging:
  sparse: false
  all_threads: false
  log_feature_hash: false
  save_final_wr: true
  show_mcts_info: false
